# Ablation: No GAN warmup — the hinge PatchGAN is co-trained from step 0
# (gan_start_epoch=0) instead of being delayed to epoch 100.
# Tests whether the GAN warmup helps or hurts: the warmup was added to stop a
# collapse that turned out to be an AdamW instability (now fixed by Muon), so the
# GAN may no longer need delaying — and its epoch-100 onset visibly dips PSNR/SSIM.
# = canonical.yaml with: train.gan_start_epoch=0
# Launch: torchrun --standalone --nproc_per_node=2 scripts/train.py --config configs/runs/abl_no_gan_warmup.yaml
run_name: abl_no_gan_warmup

train:
  seed: 42
  image_size: [64, 64]
  batch_size: 128
  lr_muon: 1e-3              # Muon for 2D weight matrices
  lr_adamw: 1e-3             # AdamW for 1D params / biases / norms
  adamw_betas: [0.9, 0.95]
  muon_mode: "match_rms_adamw"
  min_lr: 1e-5
  warmup_epochs: 10
  weight_decay: 0.01
  grad_clip: -1              # disabled; Muon updates are inherently bounded
  num_epochs: 500
  lpips_weight: 0.01
  gan_weight: 0.005          # hinge PatchGAN
  gan_start_epoch: 0         # NO warmup: GAN active from step 0
  lr_weight: 0.125           # self-consistency (left/right) weight
  save_epoch: 10
  every_n_steps: 10
  discriminator_lr_muon: 1e-4
  discriminator_lr_adamw: 1e-4
  discriminator_weight_decay: 0.01
  discriminator_min_lr: 1e-6
  discriminator_warmup_epochs: 10
  save_dir: output/checkpoints/abl_no_gan_warmup

model:
  _target_: geominr.models.model.model
  in_dim: 1
  K: 128
  embed_dim: 128
  init_cab_weight: 0.1
  cab_channel_reduction: 16
  squeeze_factor: 4
  H: 64
  W: 64
  num_heads: 4
  window_size: 8
  mlp_ratio: 4
  num_rhag_blocks: 2
  overlap_ratio: 0.5
  num_hab_blocks: 2

discriminator:
  _target_: geominr.models.discriminator.PatchDiscriminator
  in_channels: 1
  base_channels: 64

data:
  train_dir: data/dataset/train
  val_dir: data/dataset/val
  test_dir: data/dataset/test
  patch_size: [64, 64]
  batch_size: 128
  num_workers: 4
  val_num_workers: 1
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  val_prefetch_factor: 2
  val_persistent_workers: true

wandb:
  project: geominr
  name: abl_no_gan_warmup
  dir: output/wandb/abl_no_gan_warmup
  enabled: false

eval:
  model_path: output/checkpoints/abl_no_gan_warmup/model_500.pt
  data_dir: data/dataset/test
  output_dir: output/eval_results/abl_no_gan_warmup
  batch_size: 256
  num_workers: 4
  pin_memory: true
  seed: 42

inference:
  model_path: output/checkpoints/abl_no_gan_warmup/model_500.pt
  image_path: data/Original_Data_in_DICOM_Format/negative/UF181
  save_path: output/inference/abl_no_gan_warmup
  volume_depth: 48
  ap_voxel_count: 1536
  probe_radius: 12.5
  nn: true
  linear: true
  stride: [56, 56]
